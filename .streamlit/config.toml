# Configuração do Streamlit
# Colocar em: .streamlit/config.toml (na raiz do projeto)
 
[server]
# Desliga o "file watcher" que inspeciona todos os módulos importados.
# Isto elimina o spam de mensagens do transformers/torchvision no terminal.
# Custo: a app deixa de recarregar automaticamente ao guardares ficheiros —
# basta carregar 'R' no browser (ou clicar "Rerun") para recarregar.
fileWatcherType = "none"
 
[theme]
# Tema visual — verde "finanças", limpo e profissional
primaryColor = "#2E8B57"            # verde (botões, links, destaques)
backgroundColor = "#FFFFFF"          # fundo principal
secondaryBackgroundColor = "#F0F4F1" # fundo da barra lateral e cartões
textColor = "#1A1A1A"
font = "sans serif"